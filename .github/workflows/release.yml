name: Release

# Everything that publishes to nuget.org lives in this one file, deliberately.
#
# Trusted Publishing binds a nuget.org policy to a single workflow *file name*, and nuget.org
# validates the workflow in which the OIDC token is obtained. A `workflow_call` indirection
# therefore makes the validated claim ambiguous (workflow_ref names the caller, job_workflow_ref
# the callee) and is a known source of 401 token-exchange failures — NuGet/login#6. Keeping the
# login and push steps in the entry workflow keeps the claim unambiguous and needs exactly one
# trusted publishing policy: workflow file `release.yml`.
#
# Three ways in, one publish path:
#   push to main      → release-please decides whether to cut a release
#   workflow_dispatch → publish an explicit version out of band
#   push tag v*       → publish from a hand-pushed tag

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 0.1.0), without a leading v.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Only the main-branch path maintains the release PR; tags and manual dispatches go
    # straight to publishing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # A repository variable rather than a secret: the client ID is not sensitive, and `vars`
      # is readable from a step-level `if` (the `secrets` context is not).
      APP_CLIENT_ID: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # An installation token from a GitHub App, rather than GITHUB_TOKEN, is what makes the
      # release PR trigger CI — GitHub does not raise workflow events for actions taken by
      # GITHUB_TOKEN, so required checks would never run and the PR could never auto-merge.
      # The token is scoped to this repo, expires after an hour, and is revoked when the job
      # ends. Skipped (with a GITHUB_TOKEN fallback below) until the App is configured.
      - name: Mint a GitHub App installation token
        id: app-token
        if: env.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Narrowed at mint time to less than the App installation itself grants.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Without the App configured this falls back to GITHUB_TOKEN: the release PR is still
          # opened correctly, it just gets no CI run and needs a human to merge it.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge on the release PR
        if: steps.release.outputs.pr && steps.app-token.outputs.token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ fromJson(steps.release.outputs.pr || '{}').number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [release-please]
    # `always()` is required because release-please is skipped on the tag and dispatch paths,
    # and a skipped dependency would otherwise skip this job too.
    if: >
      always() &&
      needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      # Required for GitHub to issue the OIDC token that nuget.org exchanges for a
      # short-lived API key. This is the whole reason no NUGET_API_KEY secret exists.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # release-please's tag is created after this workflow's commit, so check out the
          # tag explicitly when publishing a release it just cut.
          ref: ${{ needs.release-please.outputs.release_created == 'true' && format('v{0}', needs.release-please.outputs.version) || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins the SDK used to build. The extra channels install the net8.0 and
          # net9.0 runtimes the multi-targeted test project needs.
          dotnet-version: |
            8.0.x
            9.0.x
          global-json-file: global.json

      - name: Resolve version
        id: version
        env:
          # Passed through the environment rather than interpolated into the script, so a
          # crafted input cannot inject shell.
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.version || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_VERSION:-}" ]; then
            VERSION="${RELEASE_VERSION}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::No version to publish. Dispatch with an explicit version input, or push a v* tag."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a valid NuGet version. Expected e.g. 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version="${{ steps.version.outputs.version }}"

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        # Packs every packable project in the solution (tests and samples are IsPackable=false),
        # so new companion packages are picked up automatically. Package validation runs here.
        run: >
          dotnet pack
          --no-build --configuration Release
          -p:Version="${{ steps.version.outputs.version }}"
          --output ${{ runner.temp }}/nupkgs

      # Deliberately the last step before the push: the temporary API key is valid for one hour
      # and each OIDC token may be exchanged exactly once, so it is acquired only once there is
      # something to publish.
      - name: Exchange OIDC token for a short-lived nuget.org API key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # A variable, not a secret: the nuget.org username is public (it is the package owner)
          # and grants nothing on its own — authorization comes from the OIDC token being bound
          # to this repository and workflow. Keeping it unmasked means a failed token exchange
          # reports which user was attempted instead of '***'.
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
