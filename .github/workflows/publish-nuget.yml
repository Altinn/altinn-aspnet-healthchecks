name: Publish NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0). Required unless the workflow is dispatched from a v* tag, in which case the tag is used.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        env:
          # Passed through the environment rather than interpolated into the script, so a
          # crafted input cannot inject shell.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::'${GITHUB_REF_NAME}' is a ${GITHUB_REF_TYPE}, not a tag, so there is no version to derive. Re-run with an explicit version input, or dispatch from a v* tag."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a valid NuGet version. Expected e.g. 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version="${{ steps.version.outputs.version }}"

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        # Packs every packable project in the solution (tests and samples are IsPackable=false),
        # so new companion packages are picked up automatically.
        run: >
          dotnet pack
          --no-build --configuration Release
          -p:Version="${{ steps.version.outputs.version }}"
          --output ${{ runner.temp }}/nupkgs

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
